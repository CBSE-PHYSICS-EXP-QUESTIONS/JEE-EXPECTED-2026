<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI Emotion & Gesture AR</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: "Arial", sans-serif;
    }

    #container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: black;
    }

    video {
        position: absolute;
        width: 600px;
        height: 450px;
        border-radius: 10px;
    }

    canvas {
        position: absolute;
        width: 600px;
        height: 450px;
        pointer-events: none;
    }

    .label {
        position: absolute;
        padding: 10px 18px;
        background: rgba(0,0,0,0.4);
        border-radius: 12px;
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 0 0 8px black;
        pointer-events: none;
    }
</style>
</head>

<body>

<div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<!-- Mediapipe Libraries -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let currentEmotion = "🙂";
let currentGesture = "";
let currentNumber = "";

// Start camera
navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
    video.srcObject = stream;
});

// Draw pose points
function drawLandmark(x, y, color="cyan") {
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, 2*Math.PI);
    ctx.fillStyle = color;
    ctx.fill();
}

// Emotion prediction (SIMPLE DEMO)
function detectEmotion(faceLandmarks) {
    if (!faceLandmarks) return "🙂";

    const mouthOpen =
        faceLandmarks[13].y - faceLandmarks[14].y;

    if (mouthOpen > 0.03) return "😮"; // surprise
    if (mouthOpen < -0.005) return "😡"; // angry
    return "🙂"; // neutral
}

// Gesture recognition using hand landmarks
function detectGesture(hand) {
    if (!hand) return "";

    const thumbUp = hand[4].y < hand[3].y;
    const fist = hand[8].y > hand[5].y;
    const peace = hand[8].y < hand[5].y && hand[12].y < hand[9].y;

    if (thumbUp) return "👍";
    if (peace) return "✌";
    if (fist) return "✊";
    return "✋";
}

// Count fingers (1–5)
function detectNumber(hand) {
    if (!hand) return "";

    let count = 0;
    if (hand[8].y < hand[6].y) count++;  // index
    if (hand[12].y < hand[10].y) count++; // middle
    if (hand[16].y < hand[14].y) count++; // ring
    if (hand[20].y < hand[18].y) count++; // pinky
    if (hand[4].x < hand[3].x) count++; // thumb sideways

    return count;
}

// FaceMesh
const face = new FaceMesh.FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
});
face.setOptions({ maxNumFaces: 1 });
face.onResults(res => {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if (res.multiFaceLandmarks) {
        const faceLandmarks = res.multiFaceLandmarks[0];
        currentEmotion = detectEmotion(faceLandmarks);

        // draw emotion emoji above forehead
        const forehead = faceLandmarks[10];
        ctx.font = "48px Arial";
        ctx.fillText(
            currentEmotion,
            forehead.x * canvas.width - 20,
            forehead.y * canvas.height - 30
        );

        // draw face mesh
        faceLandmarks.forEach(pt => {
            drawLandmark(pt.x * canvas.width, pt.y * canvas.height, "yellow");
        });
    }
});

// Hands
const hands = new Hands.Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({ maxNumHands: 1 });
hands.onResults(res => {

    if (res.multiHandLandmarks) {
        const hand = res.multiHandLandmarks[0];

        hand.forEach(pt => {
            drawLandmark(pt.x * canvas.width, pt.y * canvas.height, "cyan");
        });

        currentGesture = detectGesture(hand);
        currentNumber = detectNumber(hand);

        // draw gesture emoji near hand
        const wrist = hand[0];
        ctx.font = "48px Arial";
        ctx.fillText(
            currentGesture,
            wrist.x * canvas.width - 20,
            wrist.y * canvas.height - 30
        );

        // draw number above hand
        if (currentNumber > 0) {
            ctx.fillStyle = "white";
            ctx.font = "40px Arial";
            ctx.fillText(
                currentNumber.toString(),
                wrist.x * canvas.width + 40,
                wrist.y * canvas.height - 30
            );
        }
    }
});

// Pose skeleton
const pose = new Pose.Pose({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
});
pose.setOptions({ modelComplexity: 1 });
pose.onResults(res => {
    if (res.poseLandmarks) {
        res.poseLandmarks.forEach(pt => {
            drawLandmark(pt.x * canvas.width, pt.y * canvas.height, "lime");
        });
    }
});

// Camera loop
const camera = new Camera(video, {
    onFrame: async () => {
        await face.send({image: video});
        await hands.send({image: video});
        await pose.send({image: video});
    },
    width: 600,
    height: 450
});
camera.start();
</script>

</body>
</html>
